<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Analíticas Trace</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <a class="brand" href="/"><span class="brand-mark">AT</span> Analíticas Trace</a>
      <h1>Iniciar sesión</h1>
      <p class="muted">Ingrese sus credenciales para acceder al panel.</p>

      <div id="login-alert" class="alert hidden" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input class="input" id="username" name="username" autocomplete="username" required>
          <span class="field-error" id="username-error"></span>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <span class="field-error" id="password-error"></span>
        </div>
        <button class="btn btn-primary" type="submit" id="login-submit">Ingresar</button>
      </form>

      <p class="auth-hint muted">Credenciales de demostración: <strong>admin</strong> / <strong>admin123</strong></p>
      <a class="auth-back" href="/">← Volver al inicio</a>
    </section>
  </main>

  <script type="module" src="/js/auth/loginController.js"></script>
</body>
</html>
